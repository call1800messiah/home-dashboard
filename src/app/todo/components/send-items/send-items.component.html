<div class="send-items">
  <app-target-list-picker
    class="target"
    [lists]="targets$ | async"
    [storageKey]="'todo-send-target-' + list.id"
    label="Offene Einträge senden an"
    (targetChange)="targetId = $event"
  ></app-target-list-picker>
  <button
    mat-flat-button
    color="accent"
    type="button"
    class="send-button"
    [disabled]="!targetId || !userID || sending"
    (click)="send()"
  >
    <mat-icon>send</mat-icon>
    Senden
  </button>
</div>
