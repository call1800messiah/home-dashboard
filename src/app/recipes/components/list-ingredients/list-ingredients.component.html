<div class="container medium">
  <h1>Zutaten</h1>
  <button class="button-container-top" color="primary" mat-fab type="button" (click)="addIngredient()">
    <mat-icon>add</mat-icon>
  </button>

  <app-filter
    class="stacked-form"
    storageKey="ingredients"
    placeholder="Name, Typ ..."
    (filterChanged)="onFilterChanged($event)"
  ></app-filter>

  @for (ingredient of ingredients$ | async; track ingredient) {
    <mat-card
      appearance="outlined"
      class="ingredient"
      (click)="editIngredient(ingredient)"
      mat-ripple
      >
      <mat-card-title>{{ingredient.name}}</mat-card-title>
      <div class="type">
        {{ingredientTypes[ingredient.type]}}
      </div>
      <button class="button-edit" mat-mini-fab type="button">
        <mat-icon>edit</mat-icon>
      </button>
    </mat-card>
  }
</div>
